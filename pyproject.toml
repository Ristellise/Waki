[project]
name = "Waki"
version = "0.1.0"
description = "Sniffer for legacy internet bytes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "chardet==7.4.3",
    "charset-normalizer==3.4.7",
    "faust-cchardet==2.1.19",
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]